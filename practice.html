<section>
<h2>Day 1: From requirements to architecture</h2>
<ol>
<li><p>Four sentences from the Muyassir notes. Which one is a constraint the design must obey?</p><ul><li><b>A.</b> Cut the median permit cycle from 21 to 10 days</li><li><b>B.</b> The permits system offers a read interface only this year</li><li><b>C.</b> Inspectors fear the assistant will sound as if it approves</li><li><b>D.</b> Most questions are about the same 40 topics</li></ul></li>
<li><p>Four drafts for the inspectors' concern. Which one can be tested against pilot data?</p><ul><li><b>A.</b> Muyassir never sounds as if it approves a design</li><li><b>B.</b> At least 99% of all answers offer a person</li><li><b>C.</b> At least 99% of approval questions get an offer of a person</li><li><b>D.</b> The prompt tells the model that only inspectors approve</li></ul></li>
<li><p>A missing-documents check sends the published building code, an applicant's form with identity number and a site plan to a model. Under the Ministry's rule, where may the model run?</p><ul><li><b>A.</b> In the Ministry or in a cloud region in the Kingdom</li><li><b>B.</b> Anywhere, since most of the prompt is the published code</li><li><b>C.</b> Only in the Ministry's own data centre</li><li><b>D.</b> Anywhere, once the identity number is masked</li></ul></li>
<li><p>The sum of p95s is 4,290 ms: model 2,900, reranker 650, status read 400, the rest 340. Which single change most likely brings the p95 under 4,000 ms without a new model?</p><ul><li><b>A.</b> Write the conversation log faster</li><li><b>B.</b> Tune the index for a faster median query</li><li><b>C.</b> Add a second gateway check before the model</li><li><b>D.</b> Skip reranking for status questions and send fewer clauses</li></ul></li>
<li><p>The sponsor says: run costs for the first year are capped at SAR 1.2 million, the approved budget line. How do you record it?</p><ul><li><b>A.</b> As a driver, with a scenario that measures spend</li><li><b>B.</b> As a constraint, with the sponsor as its owner</li><li><b>C.</b> As a concern of the finance and cost lead</li><li><b>D.</b> As an assumption to test with the pilot</li></ul></li>
<li><p>Three interviews are done. Which note most deserves a second reading before any design is drawn?</p><ul><li><b>A.</b> The sponsor's target for the permit cycle</li><li><b>B.</b> The product owner's wish for a dark staff console</li><li><b>C.</b> The data protection officer's remark that applicant files do not leave the Kingdom</li><li><b>D.</b> The brief's sentence that the assistant must be fast and accurate</li></ul></li>
<li><p>Which response measure turns the inspectors' concern (only an inspector approves) into a testable scenario?</p><ul><li><b>A.</b> The prompt says that only inspectors approve</li><li><b>B.</b> Answers never sound like an approval</li><li><b>C.</b> At least 99% of all answers include a contact number</li><li><b>D.</b> At least 99% of approval questions receive an offer of a person</li></ul></li>
<li><p>In 400 pilot requests, one answer showed another applicant's deed. Which privacy measure should the scenario use?</p><ul><li><b>A.</b> The number of such answers, with a target of zero</li><li><b>B.</b> The mean leak rate, with a target below 1%</li><li><b>C.</b> The p95 of leaks per day</li><li><b>D.</b> The share of answers that cite a clause</li></ul></li>
<li><p>A summary job combines published zoning maps with the names and mobile numbers of engineering office contacts. Under the highest-level principle, what is the job's output?</p><ul><li><b>A.</b> Public, because most of it is published</li><li><b>B.</b> Restricted, because it holds personal data</li><li><b>C.</b> Secret, because it combines two sources</li><li><b>D.</b> Unclassified until the job runs</li></ul></li>
<li><p>The p95s of the hops of a request add up to 4,290 ms; the end-to-end p95 measured in the pilot is 4,866 ms. What explains the gap?</p><ul><li><b>A.</b> The sum of p95s always overstates, so the measurement is wrong</li><li><b>B.</b> Retries and queues add time that no single hop's percentile shows</li><li><b>C.</b> The asynchronous log write was left out of the sum</li><li><b>D.</b> p50s should have been added instead</li></ul></li>
<li><p>Why does the course write the hosting of every container on the container view?</p><ul><li><b>A.</b> So the sponsor sees which vendor was chosen</li><li><b>B.</b> Because Mermaid requires a hosting label</li><li><b>C.</b> So a reviewer can check placement against the classified flows by reading the view</li><li><b>D.</b> Because the context view cannot show external systems</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Options and decisions</h2>
<ol>
<li><p>Day 1 produced a scenario sheet, fourteen classified flows and a request budget. Which finding most limits today's options for Muyassir's answer model?</p><ul><li><b>A.</b> The request costs SAR 0.025, half of its cost target</li><li><b>B.</b> The reranker takes 650 ms of the p95</li><li><b>C.</b> Prompts with applicant context are Restricted and stay in the Kingdom</li><li><b>D.</b> One pilot answer showed another applicant's file</li></ul></li>
<li><p>The reports team wants each report routed to one of six departments, within seconds, at 95,000 reports a month, with 24,000 labelled reports from last year. Which design do you cost first?</p><ul><li><b>A.</b> A classifier trained on the labelled reports</li><li><b>B.</b> Retrieval over past reports, then a generated answer</li><li><b>C.</b> An agent that reads the report and calls department tools</li><li><b>D.</b> A frontier model with a routing prompt</li></ul></li>
<li><p>In Lab 2.2, doubling the token price moves O1's three-year total by 3%, the high forecast by 58%, and O3 loses on unanswered calls. Where should the sponsor's meeting spend its time?</p><ul><li><b>A.</b> Negotiating the token price</li><li><b>B.</b> Cutting the build cost of O1</li><li><b>C.</b> Choosing O3 because it is cheapest to run</li><li><b>D.</b> The volume forecast and how many questions each option answers</li></ul></li>
<li><p>O1's largest exit factor is its managed vector store with no bulk export (SAR 250,000). Which requirement removes it?</p><ul><li><b>A.</b> The service shall expose an OpenAI-compatible interface</li><li><b>B.</b> The provider shall export the index, embeddings and metadata in JSON Lines within 10 working days</li><li><b>C.</b> The contract shall allow exit with 90 days' notice</li><li><b>D.</b> The provider shall give reasonable help on exit</li></ul></li>
<li><p>A record chooses to skip the reranker for status questions. Its trigger reads "revisit if quality drops". Which replacement makes it a trigger someone can act on?</p><ul><li><b>A.</b> Revisit when the product owner feels quality has dropped</li><li><b>B.</b> Revisit every three years</li><li><b>C.</b> Reopen if Q1 on mixed questions falls below 0.90 on the monthly sample of 200</li><li><b>D.</b> Reopen if p95 latency rises above 4,000 ms</li></ul></li>
<li><p>The inspections team wants its standard letters drafted in the house style from inspector notes; 9,000 approved letters exist. The building code changes monthly. What does fine-tuning give them, and what must still come from elsewhere?</p><ul><li><b>A.</b> Both the style and the current code requirements</li><li><b>B.</b> The style; the facts come from the inspector's notes</li><li><b>C.</b> Nothing a prompt cannot give</li><li><b>D.</b> The current code requirements; the style comes from a template</li></ul></li>
<li><p>Option O3 has the lowest build and run cost but answers 70% of questions, against 92% for O1. Why can its three-year cost still be the highest?</p><ul><li><b>A.</b> Its build cost is paid every year</li><li><b>B.</b> Unanswered questions become calls the Ministry also pays for</li><li><b>C.</b> Non-generative systems need more servers</li><li><b>D.</b> Its token price is higher</li></ul></li>
<li><p>Doubling the token price moves O1's three-year total by 3%; the high volume forecast moves it by 58%. What belongs in the decision's review trigger?</p><ul><li><b>A.</b> The token price only</li><li><b>B.</b> A monthly request volume, then the price</li><li><b>C.</b> The build cost</li><li><b>D.</b> Nothing: O1 is cheapest</li></ul></li>
<li><p>With exit cost weighted 0.10, O1 scores 4.20 and O2 4.10; at 0.13, O2 leads. What should the options paper do?</p><ul><li><b>A.</b> Report O1 as the winner and omit the flip</li><li><b>B.</b> Raise the exit weight until the preferred option wins</li><li><b>C.</b> Report the ranking and the flip weight, and record the fragility as a bad consequence</li><li><b>D.</b> Drop weighted scoring from the paper</li></ul></li>
<li><p>Which procurement requirement can a reviewer verify?</p><ul><li><b>A.</b> The provider will support a smooth exit</li><li><b>B.</b> The provider shall make reasonable efforts to export data</li><li><b>C.</b> The provider shall export all indexed documents in JSON Lines within 10 working days of a request</li><li><b>D.</b> The provider should prefer open formats</li></ul></li>
<li><p>Which review trigger can fire?</p><ul><li><b>A.</b> If the situation changes materially</li><li><b>B.</b> When the team has time to revisit</li><li><b>C.</b> If monthly requests exceed 600,000 in the gateway logs</li><li><b>D.</b> When quality seems lower than expected</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: The shared platform</h2>
<ol>
<li><p>Decision record 1 hosts Muyassir's model in a cloud region of the Kingdom. Lab 2.2 found that volume moves the three-year cost by half and token price by 3%. What should its trigger watch first?</p><ul><li><b>A.</b> The provider's token price</li><li><b>B.</b> Monthly requests, against a threshold below the crossover</li><li><b>C.</b> The build cost of O1</li><li><b>D.</b> A single wrong answer reported in the press</li></ul></li>
<li><p>Only the inspections team uses vision, and its candidate model has no Arabic evaluation. The team asks the platform to offer vision to everyone. What does the platform do first?</p><ul><li><b>A.</b> Build a shared vision service for all nine teams</li><li><b>B.</b> Refuse, since vision is not in phase 1</li><li><b>C.</b> Add the vision model to the catalogue now</li><li><b>D.</b> Give the team a paved road to its own vision service, and ask for Arabic evidence</li></ul></li>
<li><p>The planning team (Public) labels a request Public and sends it to the external model. The text reads: "Owner 1048837265 asks whether plot 17 can be rezoned."</p><ul><li><b>A.</b> Pass it: the team and the label are both Public</li><li><b>B.</b> Pass it, and mask the number in the audit log</li><li><b>C.</b> Refuse it: the content shows an identity number, so the request is Restricted</li><li><b>D.</b> Pass it with a warning to the team</li></ul></li>
<li><p>The contact team's nightly batch moves to working hours and asks the Ministry-hosted model for more than twice its capacity. Budgets are untouched; the other teams' answers slow down. Which control fixes it?</p><ul><li><b>A.</b> A lower budget on the contact team's key</li><li><b>B.</b> Revoke the contact team's key</li><li><b>C.</b> A cap on any team's share of the Ministry-hosted model</li><li><b>D.</b> Fall back to a cloud model when the queue is long</li></ul></li>
<li><p>Priced with the platform's card, August's In-Kingdom Cloud showback is SAR 500 above the invoice. Every token is accounted for. What is the right fix?</p><ul><li><b>A.</b> Add a correction line of SAR -500 to the unallocated bucket</li><li><b>B.</b> Update the price card for August</li><li><b>C.</b> Ask teams to tag their calls better</li><li><b>D.</b> Allocate the invoice lines, the credit included, to the usage they cover</li></ul></li>
<li><p>On a shared AI platform, eight of nine teams use or ask for chat and one team asks for speech. How should the platform serve speech?</p><ul><li><b>A.</b> Give the speech team a paved road to a service it owns, behind the gateway</li><li><b>B.</b> Build a shared speech service for all nine teams first</li><li><b>C.</b> Refuse speech until more teams ask for it</li><li><b>D.</b> Let the speech team call any external provider directly</li></ul></li>
<li><p>A candidate model tops a public leaderboard, has no evaluation on the Ministry's Arabic set, and its licence forbids production use. What does admission decide?</p><ul><li><b>A.</b> Admit it for Public data only</li><li><b>B.</b> Reject it on the licence, and ask for Arabic evidence if it is proposed again</li><li><b>C.</b> Admit it on the leaderboard score and evaluate later</li><li><b>D.</b> Admit it for a three-month trial in production</li></ul></li>
<li><p>A request from a Restricted team declares no classification and names an external model. What should the gateway's policy do?</p><ul><li><b>A.</b> Pass it, since nothing says the data is Restricted</li><li><b>B.</b> Pass it and log the full prompt for review</li><li><b>C.</b> Ask the model whether the prompt holds personal data</li><li><b>D.</b> Treat it as Restricted and refuse it</li></ul></li>
<li><p>Why does the gateway's audit log store a hash of each prompt instead of the prompt?</p><ul><li><b>A.</b> Hashes are shorter, so the log is cheaper</li><li><b>B.</b> The log can prove what was sent without becoming a copy of the data</li><li><b>C.</b> A hash lets the platform team read the prompt later</li><li><b>D.</b> Regulators require hashing of all logs</li></ul></li>
<li><p>Under one shared key and budget, a leaked key at one team cuts every team off paid models. Which change contains the leak to that team?</p><ul><li><b>A.</b> A larger shared budget</li><li><b>B.</b> A cap on each team's share of the Ministry-hosted model</li><li><b>C.</b> A key and budget per team, with revocation of a key that spikes</li><li><b>D.</b> A fallback to the Ministry-hosted model</li></ul></li>
<li><p>A showback priced with the platform's price card is 10.9% above the provider's September invoice after a price cut. What makes the showback reconcile every month?</p><ul><li><b>A.</b> Allocate each invoice line to the usage it covers</li><li><b>B.</b> Update the price card each quarter</li><li><b>C.</b> Add the difference to an 'other' line</li><li><b>D.</b> Ask the teams to tag every call</li></ul></li>
<li><p>The data centre's fixed cost is shared by tokens and the contact team, whose speech model counts many tokens per call, gets 71% of it; by requests it would get 24%. What should the architect do?</p><ul><li><b>A.</b> Use tokens, since it is the default</li><li><b>B.</b> Use whichever share the contact team accepts</li><li><b>C.</b> Split the difference at 47%</li><li><b>D.</b> Choose the key that best tracks server time, measure it, and record the choice</li></ul></li>
</ol>
</section>
<section>
<h2>Day 4: Reference designs and reviews</h2>
<ol>
<li><p>Asas moves from one shared key to per-team keys. The planning team's key leaks and calls the external model 400 times a minute. What keeps the other eight teams served?</p><ul><li><b>A.</b> Revoking that team's key when its rate spikes, under per-team budgets</li><li><b>B.</b> A cap on each team's share of the Ministry-hosted model</li><li><b>C.</b> A larger shared budget for the hour</li><li><b>D.</b> A showback that names the planning team</li></ul></li>
<li><p>In March the platform adds an Arabic evaluation gate to the template. Services generated after March have it; the reports team's service, generated in January, does not. What went wrong?</p><ul><li><b>A.</b> The reports team should have read the release notes</li><li><b>B.</b> The template should have had more questions</li><li><b>C.</b> The service was treated as a one-time copy, with no update path from the template</li><li><b>D.</b> The gateway should run the evaluation</li></ul></li>
<li><p>The planning team's zoning assistant sends questions about published zoning plans, classified Public, to the external model. A colleague proposes failing every design with an external model, to be safe.</p><ul><li><b>A.</b> Yes: external models are a risk whatever the data</li><li><b>B.</b> Pass it with a warning that cannot be silenced</li><li><b>C.</b> Send every external design to the board for review</li><li><b>D.</b> No: the check enforces the rule by level, and Public data may go to an external host</li></ul></li>
<li><p>"A 10% sample review of approved reports is the only check that inspectors' approvals are real." The oversight scenario requires every filed report to carry an approval.</p><ul><li><b>A.</b> Non-compliance</li><li><b>B.</b> A sensitivity point: whether approvals mean anything rests on that one rate</li><li><b>C.</b> A non-risk, since every report is approved</li><li><b>D.</b> A trade-off point</li></ul></li>
<li><p>"DR-2026-07: approved. The inspections team may send clean photos to ext-vision-q. Owner: Rabah Al-Mujil. Conditions: the detector runs on every photo; flagged photos stay on the manual path."</p><ul><li><b>A.</b> An expiry, and the events that would bring it back to the board</li><li><b>B.</b> An owner for the conditions</li><li><b>C.</b> Any conditions at all</li><li><b>D.</b> The scope of what is allowed</li></ul></li>
<li><p>A platform's service template ships with its evaluation gate switched on. What does that default achieve that a recommendation in the template's README does not?</p><ul><li><b>A.</b> Teams that take the easy way get the gate without deciding to</li><li><b>B.</b> It makes the gate impossible to switch off</li><li><b>C.</b> It removes the need for an evaluation set</li><li><b>D.</b> It moves the evaluation to the gateway</li></ul></li>
<li><p>A team generating a service from the platform's template answers Restricted for its data and an external model for its alias. What should the template do?</p><ul><li><b>A.</b> Generate the service and leave the refusal to the gateway</li><li><b>B.</b> Refuse at generation, naming the placement rule the answer breaks</li><li><b>C.</b> Generate the service with the evaluation gate off</li><li><b>D.</b> Generate the service and email the platform team</li></ul></li>
<li><p>A design sends Restricted photos to a vision model hosted in the Kingdom, with an external model as its fallback. A placement check looks only at each flow's destination. What happens?</p><ul><li><b>A.</b> The check fails the design, since the fallback is external</li><li><b>B.</b> The check fails every design that has a fallback</li><li><b>C.</b> The check passes the design, though Restricted photos reach an external model when the first one fails</li><li><b>D.</b> The check cannot run on a design with a fallback</li></ul></li>
<li><p>A pipeline runs test, deploy, then a non-blocking evaluate stage with a 0.85 threshold on Arabic and English sets. Does it meet a standard that asks for an evaluation gate?</p><ul><li><b>A.</b> Yes: it has an evaluate stage with a threshold</li><li><b>B.</b> Yes, if the threshold is raised to 0.90</li><li><b>C.</b> No: it needs a third language set</li><li><b>D.</b> No: an evaluation after deployment that blocks nothing gates nothing</li></ul></li>
<li><p>In a review, the board notes: 'The vision call takes 3,800 ms of the 5,000 ms latency budget.' How should it be tagged?</p><ul><li><b>A.</b> A sensitivity point: the latency scenario depends on that one parameter</li><li><b>B.</b> Non-compliance: the budget is nearly spent</li><li><b>C.</b> A trade-off point: latency against quality</li><li><b>D.</b> A non-risk: the budget is met</li></ul></li>
<li><p>A review has an hour. Which scenario should it examine first?</p><ul><li><b>A.</b> Oversight: important, easy to meet</li><li><b>B.</b> Arabic answer quality: important, hard to meet</li><li><b>C.</b> Latency: of medium importance, hard to meet</li><li><b>D.</b> Operability: of low importance, of medium difficulty</li></ul></li>
<li><p>A deviation lets a team send photos the on-device detector passes as clean to an external model. Which record is complete?</p><ul><li><b>A.</b> Approved; owner named; conditions listed</li><li><b>B.</b> Approved for as long as the team needs it, with conditions</li><li><b>C.</b> Approved with conditions that carry numbers, the residual risk and who accepts it, an expiry date and reopen triggers</li><li><b>D.</b> Refused, because any risk is too much</li></ul></li>
</ol>

e the identity number is masked"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The set combines Public and Restricted items, so it is Restricted, which the rule allows in the Ministry and in a cloud region in the Kingdom.","misconceptions":["","Takes the level of most of the text: the code is the longest part, but the highest level in the set decides","Over-classifies: personal data in a permit form is Restricted here, not Secret","Thinks masking in the prompt changes the level: the site plan and form are still in the set"],"lo":["LO2"],"day":1,"session":3,"slide":{"deck":"day1","id":"check-flow-level","title":"Where may this flow go?"},"level":null,"pool":"checkpoint"},{"id":"check-budget-q1","type":"single","prompt":"The sum of p95s is 4,290 ms: model 2,900, reranker 650, status read 400, the rest 340. Which single change most likely brings the p95 under 4,000 ms without a new model?","options":[{"key":"A","text":"Write the conversation log faster"},{"key":"B","text":"Tune the index for a faster median query"},{"key":"C","text":"Add a second gateway check before the model"},{"key":"D","text":"Skip reranking for status questions and send fewer clauses"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The reranker's 650 ms and the context size are the levers in the architect's hands, and the sum drops to 3,640 ms; answer quality must then be re-tested.","misconceptions":["Optimises a hop that is off the user's path: the log write is asynchronous and adds nothing users wait for","Optimises the p50 instead of the tail: a faster median retrieval moves the p95 sum by tens of milliseconds","Adds a hop for safety without measuring its cost: a second check adds time, it does not remove it",""],"lo":["LO2"],"day":1,"session":4,"slide":{"deck":"day1","id":"check-budget","title":"Which change can bring Muyassir under 4,000 ms?"},"level":null,"pool":"checkpoint"},{"id":"review-day1-q1","type":"single","prompt":"Day 1 produced a scenario sheet, fourteen classified flows and a request budget. Which finding most limits today's options for Muyassir's answer model?","options":[{"key":"A","text":"The request costs SAR 0.025, half of its cost target"},{"key":"B","text":"The reranker takes 650 ms of the p95"},{"key":"C","text":"Prompts with applicant context are Restricted and stay in the Kingdom"},{"key":"D","text":"One pilot answer showed another applicant's file"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The level of the prompt removes every option that would send it to an external model; the other findings are fixed inside an option.","misconceptions":["Treats a passed scenario as a limit: cost at SAR 0.025 a request leaves room, it rules nothing out","Mistakes a fixable hop for a placement limit: the reranker is a design choice inside every option","","Confuses an incident to fix with a constraint on options: P0288 is a defect in the status read"],"lo":["LO1","LO2"],"day":2,"session":null,"slide":{"deck":"day2","id":"review-day1","title":"Which finding of Day 1 changes the options you may draw today?"},"level":null,"pool":"checkpoint"},{"id":"check-pattern-q1","type":"single","prompt":"The reports team wants each report routed to one of six departments, within seconds, at 95,000 reports a month, with 24,000 labelled reports from last year. Which design do you cost first?","options":[{"key":"A","text":"A classifier trained on the labelled reports"},{"key":"B","text":"Retrieval over past reports, then a generated answer"},{"key":"C","text":"An agent that reads the report and calls department tools"},{"key":"D","text":"A frontier model with a routing prompt"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A label from a fixed list, many labelled examples and a need for speed are the fit questions of the classical pattern.","misconceptions":["","Uses retrieval for a label: there is no document to cite, only a category to choose","Adds steps a single label does not need: no step depends on another","Reaches for the most capable model before checking the output's shape and the labels"],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"check-pattern","title":"Which pattern for the street-light reports?"},"level":null,"pool":"checkpoint"},{"id":"check-tco-q1","type":"single","prompt":"In Lab 2.2, doubling the token price moves O1's three-year total by 3%, the high forecast by 58%, and O3 loses on unanswered calls. Where should the sponsor's meeting spend its time?","options":[{"key":"A","text":"Negotiating the token price"},{"key":"B","text":"Cutting the build cost of O1"},{"key":"C","text":"Choosing O3 because it is cheapest to run"},{"key":"D","text":"The volume forecast and how many questions each option answers"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The ranking depends on volume and coverage; the sensitivity table shows it, so the meeting argues about those.","misconceptions":["Debates the input with the least effect: the token price barely moves the ranking at this volume","Ignores that build is a small share of three years and similar across options","Treats O3 as cheapest because it is cheapest to run: its unanswered calls dominate",""],"lo":["LO3"],"day":2,"session":2,"slide":{"deck":"day2","id":"check-tco","title":"What should the options paper argue about?"},"level":null,"pool":"checkpoint"},{"id":"check-lockin-q1","type":"single","prompt":"O1's largest exit factor is its managed vector store with no bulk export (SAR 250,000). Which requirement removes it?","options":[{"key":"A","text":"The service shall expose an OpenAI-compatible interface"},{"key":"B","text":"The provider shall export the index, embeddings and metadata in JSON Lines within 10 working days"},{"key":"C","text":"The contract shall allow exit with 90 days' notice"},{"key":"D","text":"The provider shall give reasonable help on exit"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The cost is in the data; only an export of the data, in an open format and a set time, removes it.","misconceptions":["Moves the calls but not the data: an interface standard leaves the index where it is","","Fixes the contract term, not the data: leaving early is cheaper, the index is still stuck","Has no verifiable term: 'reasonable' cannot be checked"],"lo":["LO3"],"day":2,"session":3,"slide":{"deck":"day2","id":"check-lockin","title":"Which requirement removes O1's largest exit cost?"},"level":null,"pool":"checkpoint"},{"id":"check-record-q1","type":"single","prompt":"A record chooses to skip the reranker for status questions. Its trigger reads \"revisit if quality drops\". Which replacement makes it a trigger someone can act on?","options":[{"key":"A","text":"Revisit when the product owner feels quality has dropped"},{"key":"B","text":"Revisit every three years"},{"key":"C","text":"Reopen if Q1 on mixed questions falls below 0.90 on the monthly sample of 200"},{"key":"D","text":"Reopen if p95 latency rises above 4,000 ms"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The risk the decision took is answer quality on mixed questions; the trigger measures exactly that, with a threshold and a sample.","misconceptions":["Keeps the vagueness and adds a person: nobody can tell when quality has dropped","Sets a date with no link to the risk the decision took","","Chooses a metric the decision does not affect: latency improved by the change"],"lo":["LO3"],"day":2,"session":4,"slide":{"deck":"day2","id":"check-record","title":"Which line makes this record reviewable?"},"level":null,"pool":"checkpoint"},{"id":"review-day2-q1","type":"single","prompt":"Decision record 1 hosts Muyassir's model in a cloud region of the Kingdom. Lab 2.2 found that volume moves the three-year cost by half and token price by 3%. What should its trigger watch first?","options":[{"key":"A","text":"The provider's token price"},{"key":"B","text":"Monthly requests, against a threshold below the crossover"},{"key":"C","text":"The build cost of O1"},{"key":"D","text":"A single wrong answer reported in the press"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The ranking depends on volume; the trigger fires before the volume at which the Ministry-hosted option catches up.","misconceptions":["Watches the input that barely moves the ranking at this volume","","Watches a cost already spent: build cannot reopen a hosting decision","Confuses an incident with a decision trigger: one bad answer is a defect to fix"],"lo":["LO3"],"day":3,"session":null,"slide":{"deck":"day3","id":"review-day2","title":"What does record one's review trigger watch?"},"level":null,"pool":"checkpoint"},{"id":"check-phase-q1","type":"single","prompt":"Only the inspections team uses vision, and its candidate model has no Arabic evaluation. The team asks the platform to offer vision to everyone. What does the platform do first?","options":[{"key":"A","text":"Build a shared vision service for all nine teams"},{"key":"B","text":"Refuse, since vision is not in phase 1"},{"key":"C","text":"Add the vision model to the catalogue now"},{"key":"D","text":"Give the team a paved road to its own vision service, and ask for Arabic evidence"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"One team's need is served by a golden path the team owns; the catalogue waits for the evidence.","misconceptions":["Builds from one team's request: shared services carry shared cost and an owner for nine teams","Treats team-owned as unsupported: the team still needs the gateway and a template","Admits a model without the evidence the catalogue requires",""],"lo":["LO4"],"day":3,"session":1,"slide":{"deck":"day3","id":"check-phase","title":"Should Asas build a shared vision service now?"},"level":null,"pool":"checkpoint"},{"id":"check-gateway-q1","type":"single","prompt":"The planning team (Public) labels a request Public and sends it to the external model. The text reads: \"Owner 1048837265 asks whether plot 17 can be rezoned.\"","options":[{"key":"A","text":"Pass it: the team and the label are both Public"},{"key":"B","text":"Pass it, and mask the number in the audit log"},{"key":"C","text":"Refuse it: the content shows an identity number, so the request is Restricted"},{"key":"D","text":"Pass it with a warning to the team"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The level is the highest the gateway can see; the identity number makes it Restricted, which may not go to an external model.","misconceptions":["Trusts the label over the content: labels are what the caller remembered to send","Fixes the data after the fact: masking in the log does not stop the text reaching the model","","Moves the risk to the team without stopping it: a warning lets the data out"],"lo":["LO4"],"day":3,"session":2,"slide":{"deck":"day3","id":"check-gateway","title":"What should the gateway do with this request?"},"level":null,"pool":"checkpoint"},{"id":"check-tenancy-q1","type":"single","prompt":"The contact team's nightly batch moves to working hours and asks the Ministry-hosted model for more than twice its capacity. Budgets are untouched; the other teams' answers slow down. Which control fixes it?","options":[{"key":"A","text":"A lower budget on the contact team's key"},{"key":"B","text":"Revoke the contact team's key"},{"key":"C","text":"A cap on any team's share of the Ministry-hosted model"},{"key":"D","text":"Fall back to a cloud model when the queue is long"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The harm is shared capacity; only a cap on each team's share keeps the others served.","misconceptions":["Fixes spend, not capacity: the batch runs on a fixed-cost model and spends nothing per call","Treats a legitimate overload as a leak: the key is the team's own and correctly used","","Moves the load instead of capping it: the batch spills onto a paid model the other teams share, and only a cloud region in the Kingdom may take its Restricted transcripts"],"lo":["LO4"],"day":3,"session":3,"slide":{"deck":"day3","id":"check-tenancy","title":"Which control stops this from harming other teams?"},"level":null,"pool":"checkpoint"},{"id":"check-showback-q1","type":"single","prompt":"Priced with the platform's card, August's In-Kingdom Cloud showback is SAR 500 above the invoice. Every token is accounted for. What is the right fix?","options":[{"key":"A","text":"Add a correction line of SAR -500 to the unallocated bucket"},{"key":"B","text":"Update the price card for August"},{"key":"C","text":"Ask teams to tag their calls better"},{"key":"D","text":"Allocate the invoice lines, the credit included, to the usage they cover"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The invoice holds a credit the card cannot know; allocating the invoice passes it to the teams in proportion to their use.","misconceptions":["Hides a gap instead of explaining it: a fudge line makes the next month's gap invisible too","Updates a card that was right: the provider's prices did not change in August","Blames tags for a pricing gap: tags decide who pays, not how much",""],"lo":["LO4"],"day":3,"session":4,"slide":{"deck":"day3","id":"check-showback","title":"Why does the August showback miss the invoice?"},"level":null,"pool":"checkpoint"},{"id":"review-day3-q1","type":"single","prompt":"Asas moves from one shared key to per-team keys. The planning team's key leaks and calls the external model 400 times a minute. What keeps the other eight teams served?","options":[{"key":"A","text":"Revoking that team's key when its rate spikes, under per-team budgets"},{"key":"B","text":"A cap on each team's share of the Ministry-hosted model"},{"key":"C","text":"A larger shared budget for the hour"},{"key":"D","text":"A showback that names the planning team"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A per-team key can be revoked without touching anyone else, and a per-team budget bounds the spend until it is.","misconceptions":["","Contains capacity incidents; the leak spends money on a paid model and takes no shared capacity","Delays the outage: a larger shared pot still runs out for everyone","Decides who pays afterwards; it stops nothing during the hour"],"lo":["LO4"],"day":4,"session":null,"slide":{"deck":"day4","id":"review-day3","title":"Which control contains a leaked key to one team?"},"level":null,"pool":"checkpoint"},{"id":"check-golden-q1","type":"single","prompt":"In March the platform adds an Arabic evaluation gate to the template. Services generated after March have it; the reports team's service, generated in January, does not. What went wrong?","options":[{"key":"A","text":"The reports team should have read the release notes"},{"key":"B","text":"The template should have had more questions"},{"key":"C","text":"The service was treated as a one-time copy, with no update path from the template"},{"key":"D","text":"The gateway should run the evaluation"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A golden path needs a way to bring template changes to services already generated from it.","misconceptions":["Blames the team for a platform design gap: nothing told them or carried the change","Makes the template harder to use without fixing older services","","Moves a template problem to the gateway, which cannot see a service's evaluation"],"lo":["LO5"],"day":4,"session":1,"slide":{"deck":"day4","id":"check-golden","title":"Why did the reports team's service miss the new gate?"},"level":null,"pool":"checkpoint"},{"id":"check-fitness-q1","type":"single","prompt":"The planning team's zoning assistant sends questions about published zoning plans, classified Public, to the external model. A colleague proposes failing every design with an external model, to be safe.","options":[{"key":"A","text":"Yes: external models are a risk whatever the data"},{"key":"B","text":"Pass it with a warning that cannot be silenced"},{"key":"C","text":"Send every external design to the board for review"},{"key":"D","text":"No: the check enforces the rule by level, and Public data may go to an external host"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A check stricter than the standard blocks allowed work, and teams learn to switch it off.","misconceptions":["Treats any external host as a breach: the rule allows Public data anywhere","Ignores that the rule is per level: a warning on every external call trains teams to ignore warnings","Moves the decision to a person on every commit, which is what the check was meant to save",""],"lo":["LO5"],"day":4,"session":2,"slide":{"deck":"day4","id":"check-fitness","title":"Should the placement check fail this design?"},"level":null,"pool":"checkpoint"},{"id":"check-review-q1","type":"single","prompt":"\"A 10% sample review of approved reports is the only check that inspectors' approvals are real.\" The oversight scenario requires every filed report to carry an approval.","options":[{"key":"A","text":"Non-compliance"},{"key":"B","text":"A sensitivity point: whether approvals mean anything rests on that one rate"},{"key":"C","text":"A non-risk, since every report is approved"},{"key":"D","text":"A trade-off point"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A sensitivity point is one parameter a scenario depends on; lower the sample rate and rubber-stamping goes unseen.","misconceptions":["Reads a weak spot as a broken rule: no standard sets the sample rate","","Ignores the dependency: approval is designed in, and its value hangs on one parameter","Needs two attributes moving in opposite directions; this is one parameter under one scenario"],"lo":["LO6"],"day":4,"session":3,"slide":{"deck":"day4","id":"check-review","title":"How should the board tag this observation?"},"level":null,"pool":"checkpoint"},{"id":"check-deviation-q1","type":"single","prompt":"\"DR-2026-07: approved. The inspections team may send clean photos to ext-vision-q. Owner: Rabah Al-Mujil. Conditions: the detector runs on every photo; flagged photos stay on the manual path.\"","options":[{"key":"A","text":"An expiry, and the events that would bring it back to the board"},{"key":"B","text":"An owner for the conditions"},{"key":"C","text":"Any conditions at all"},{"key":"D","text":"The scope of what is allowed"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Without an expiry and reopen triggers, the exception outlives its reason and becomes the standard.","misconceptions":["","An owner is named: Rabah Al-Mujil","Conditions are stated, though they need numbers; the larger gap is that nothing ends it","Scope is clear: one team, clean photos, one model"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"check-deviation","title":"What is missing from this approval?"},"level":null,"pool":"checkpoint"},{"id":"d1-sort-budget-cap","type":"single","prompt":"The sponsor says: run costs for the first year are capped at SAR 1.2 million, the approved budget line. How do you record it?","options":[{"key":"A","text":"As a driver, with a scenario that measures spend"},{"key":"B","text":"As a constraint, with the sponsor as its owner"},{"key":"C","text":"As a concern of the finance and cost lead"},{"key":"D","text":"As an assumption to test with the pilot"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The cap is a decision already taken that bounds every option; nobody builds the system to spend it.","misconceptions":["Treats a limit as a goal: the system does not exist to spend SAR 1.2 million","","Mistakes a fixed decision for a worry: the cap is approved, not feared","Confuses an approved budget with a belief: nothing about it needs testing"],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"d1-hidden-constraint","type":"single","prompt":"Three interviews are done. Which note most deserves a second reading before any design is drawn?","options":[{"key":"A","text":"The sponsor's target for the permit cycle"},{"key":"B","text":"The product owner's wish for a dark staff console"},{"key":"C","text":"The data protection officer's remark that applicant files do not leave the Kingdom"},{"key":"D","text":"The brief's sentence that the assistant must be fast and accurate"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A placement constraint said in passing rules out whole designs, so it is found before options are drawn.","misconceptions":["Thinks drivers rule designs out: a target shapes the options but forbids none","Gives weight to noise: no architecture decision depends on the console colour","","Confuses vague targets with constraints: they need numbers, not a second reading"],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"d1-measure-oversight","type":"single","prompt":"Which response measure turns the inspectors' concern (only an inspector approves) into a testable scenario?","options":[{"key":"A","text":"The prompt says that only inspectors approve"},{"key":"B","text":"Answers never sound like an approval"},{"key":"C","text":"At least 99% of all answers include a contact number"},{"key":"D","text":"At least 99% of approval questions receive an offer of a person"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"It names the slice, the metric, the statistic and the target, so a reviewer can compute it from logs.","misconceptions":["Mistakes a design choice for a measured response","States an intent with no metric or statistic","Measures the wrong population: approval questions are diluted among all answers",""],"lo":["LO1"],"day":1,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"d1-privacy-stat","type":"single","prompt":"In 400 pilot requests, one answer showed another applicant's deed. Which privacy measure should the scenario use?","options":[{"key":"A","text":"The number of such answers, with a target of zero"},{"key":"B","text":"The mean leak rate, with a target below 1%"},{"key":"C","text":"The p95 of leaks per day"},{"key":"D","text":"The share of answers that cite a clause"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A single leak is an incident; a sum with a target of zero fails on it, a mean of 0.25% hides it.","misconceptions":["","Lets a rate hide a harm that counts one by one","Uses a latency statistic for an event count","Measures transparency, not privacy"],"lo":["LO1"],"day":1,"session":2,"slide":null,"level":"evaluate","pool":"practice"},{"id":"d1-flow-level","type":"single","prompt":"A summary job combines published zoning maps with the names and mobile numbers of engineering office contacts. Under the highest-level principle, what is the job's output?","options":[{"key":"A","text":"Public, because most of it is published"},{"key":"B","text":"Restricted, because it holds personal data"},{"key":"C","text":"Secret, because it combines two sources"},{"key":"D","text":"Unclassified until the job runs"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A set that combines levels takes the highest; contact persons are personal data and Restricted in the case.","misconceptions":["Takes the level of the largest part instead of the highest","","Thinks combining raises the level by itself","Ignores that data is classified when it is created"],"lo":["LO2"],"day":1,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"d1-budget-bound","type":"single","prompt":"The p95s of the hops of a request add up to 4,290 ms; the end-to-end p95 measured in the pilot is 4,866 ms. What explains the gap?","options":[{"key":"A","text":"The sum of p95s always overstates, so the measurement is wrong"},{"key":"B","text":"Retries and queues add time that no single hop's percentile shows"},{"key":"C","text":"The asynchronous log write was left out of the sum"},{"key":"D","text":"p50s should have been added instead"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The sum of p95s bounds the hops; retries and queueing between hops add time the per-hop numbers miss.","misconceptions":["Trusts the bound over the measurement","","Adds a hop users never wait for","A sum of medians understates the tail even more"],"lo":["LO2"],"day":1,"session":4,"slide":null,"level":"analyze","pool":"practice"},{"id":"d1-views-hosting","type":"single","prompt":"Why does the course write the hosting of every container on the container view?","options":[{"key":"A","text":"So the sponsor sees which vendor was chosen"},{"key":"B","text":"Because Mermaid requires a hosting label"},{"key":"C","text":"So a reviewer can check placement against the classified flows by reading the view"},{"key":"D","text":"Because the context view cannot show external systems"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Hosting on the boxes lets placement be read and diffed with the view.","misconceptions":["Mistakes a vendor choice for the placement question","Confuses a course convention with a tool rule","","The context view does show external systems"],"lo":["LO2"],"day":1,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"d2-pattern-letters","type":"single","prompt":"The inspections team wants its standard letters drafted in the house style from inspector notes; 9,000 approved letters exist. The building code changes monthly. What does fine-tuning give them, and what must still come from elsewhere?","options":[{"key":"A","text":"Both the style and the current code requirements"},{"key":"B","text":"The style; the facts come from the inspector's notes"},{"key":"C","text":"Nothing a prompt cannot give"},{"key":"D","text":"The current code requirements; the style comes from a template"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Fine-tuning shapes a stable form from many examples; facts that change come from the notes or retrieval.","misconceptions":["Thinks tuning keeps knowledge current: the next circular makes a tuned model wrong","","Ignores what 9,000 examples make possible; a prompt is a rival to test, not a certainty","Inverts the two: tuning is for form, retrieval for knowledge that changes"],"lo":["LO3"],"day":2,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"d2-unanswered-cost","type":"single","prompt":"Option O3 has the lowest build and run cost but answers 70% of questions, against 92% for O1. Why can its three-year cost still be the highest?","options":[{"key":"A","text":"Its build cost is paid every year"},{"key":"B","text":"Unanswered questions become calls the Ministry also pays for"},{"key":"C","text":"Non-generative systems need more servers"},{"key":"D","text":"Its token price is higher"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The cost model counts the calls created by unanswered questions; at 30% unanswered they dominate.","misconceptions":["Build is a first-year line only","","O3 runs on fixed infrastructure with no capacity units","O3 has no tokens at all"],"lo":["LO3"],"day":2,"session":2,"slide":null,"level":"evaluate","pool":"practice"},{"id":"d2-sensitivity","type":"single","prompt":"Doubling the token price moves O1's three-year total by 3%; the high volume forecast moves it by 58%. What belongs in the decision's review trigger?","options":[{"key":"A","text":"The token price only"},{"key":"B","text":"A monthly request volume, then the price"},{"key":"C","text":"The build cost"},{"key":"D","text":"Nothing: O1 is cheapest"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The ranking depends most on volume, so the trigger watches volume first and price second.","misconceptions":["Watches the input with the least effect","","Build is spent and cannot reopen the decision","A cheapest option today can stop being cheapest; that is what triggers are for"],"lo":["LO3"],"day":2,"session":2,"slide":null,"level":"analyze","pool":"practice"},{"id":"d2-flip-weight","type":"single","prompt":"With exit cost weighted 0.10, O1 scores 4.20 and O2 4.10; at 0.13, O2 leads. What should the options paper do?","options":[{"key":"A","text":"Report O1 as the winner and omit the flip"},{"key":"B","text":"Raise the exit weight until the preferred option wins"},{"key":"C","text":"Report the ranking and the flip weight, and record the fragility as a bad consequence"},{"key":"D","text":"Drop weighted scoring from the paper"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Weights are opinions; a close ranking is reported with the weight that reverses it.","misconceptions":["Presents an opinion as a fact","Tunes weights to a conclusion","","Throws away a useful method instead of reporting its sensitivity"],"lo":["LO3"],"day":2,"session":3,"slide":null,"level":"evaluate","pool":"practice"},{"id":"d2-requirement","type":"single","prompt":"Which procurement requirement can a reviewer verify?","options":[{"key":"A","text":"The provider will support a smooth exit"},{"key":"B","text":"The provider shall make reasonable efforts to export data"},{"key":"C","text":"The provider shall export all indexed documents in JSON Lines within 10 working days of a request"},{"key":"D","text":"The provider should prefer open formats"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"It uses 'shall', names a format and a time a reviewer can test.","misconceptions":["Uses 'will' and no measurable term","Contains an escape phrase","","Uses 'should' and no testable term"],"lo":["LO3"],"day":2,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"d2-adr-trigger","type":"single","prompt":"Which review trigger can fire?","options":[{"key":"A","text":"If the situation changes materially"},{"key":"B","text":"When the team has time to revisit"},{"key":"C","text":"If monthly requests exceed 600,000 in the gateway logs"},{"key":"D","text":"When quality seems lower than expected"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"It names a measurement, a threshold and where it is measured.","misconceptions":["No measurement","No measurement or date","","A feeling, not a threshold"],"lo":["LO3"],"day":2,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"d3-phase","type":"single","prompt":"On a shared AI platform, eight of nine teams use or ask for chat and one team asks for speech. How should the platform serve speech?","options":[{"key":"A","text":"Give the speech team a paved road to a service it owns, behind the gateway"},{"key":"B","text":"Build a shared speech service for all nine teams first"},{"key":"C","text":"Refuse speech until more teams ask for it"},{"key":"D","text":"Let the speech team call any external provider directly"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"One team's need is served by a golden path the team owns; shared services are for what most teams need.","misconceptions":["","Builds a shared service, with shared cost and an owner, for one team","Treats a team-owned capability as unsupported","Bypasses the gateway and its placement policy"],"lo":["LO4"],"day":3,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"d3-admit","type":"single","prompt":"A candidate model tops a public leaderboard, has no evaluation on the Ministry's Arabic set, and its licence forbids production use. What does admission decide?","options":[{"key":"A","text":"Admit it for Public data only"},{"key":"B","text":"Reject it on the licence, and ask for Arabic evidence if it is proposed again"},{"key":"C","text":"Admit it on the leaderboard score and evaluate later"},{"key":"D","text":"Admit it for a three-month trial in production"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Admission rests on the licence and the Ministry's own evaluations; a leaderboard is neither.","misconceptions":["Data level does not cure a licence that forbids production use","","Admits without the evidence the catalogue requires","A trial in production is still production use"],"lo":["LO4"],"day":3,"session":2,"slide":null,"level":"analyze","pool":"practice"},{"id":"d3-label","type":"single","prompt":"A request from a Restricted team declares no classification and names an external model. What should the gateway's policy do?","options":[{"key":"A","text":"Pass it, since nothing says the data is Restricted"},{"key":"B","text":"Pass it and log the full prompt for review"},{"key":"C","text":"Ask the model whether the prompt holds personal data"},{"key":"D","text":"Treat it as Restricted and refuse it"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"An undeclared request takes the team's highest level: the policy fails closed.","misconceptions":["Fails open: a missing label is not a Public label","Creates a second copy of possibly Restricted data in the log","Sends the data to the model to decide whether it may be sent",""],"lo":["LO4"],"day":3,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"d3-audit","type":"single","prompt":"Why does the gateway's audit log store a hash of each prompt instead of the prompt?","options":[{"key":"A","text":"Hashes are shorter, so the log is cheaper"},{"key":"B","text":"The log can prove what was sent without becoming a copy of the data"},{"key":"C","text":"A hash lets the platform team read the prompt later"},{"key":"D","text":"Regulators require hashing of all logs"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The log must not hold Restricted text; a hash still proves whether a given text was sent.","misconceptions":["Size is a side effect, not the reason","","A hash cannot be read back into the text","Invents a requirement; the reason is the data the log would hold"],"lo":["LO4"],"day":3,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"d3-tenancy","type":"single","prompt":"Under one shared key and budget, a leaked key at one team cuts every team off paid models. Which change contains the leak to that team?","options":[{"key":"A","text":"A larger shared budget"},{"key":"B","text":"A cap on each team's share of the Ministry-hosted model"},{"key":"C","text":"A key and budget per team, with revocation of a key that spikes"},{"key":"D","text":"A fallback to the Ministry-hosted model"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Per-team keys let one key be revoked without stopping the others; per-key budgets bound the spend.","misconceptions":["Only delays the outage","Contains capacity incidents, not spend","","Moves the load to a capacity every team shares, and the leaked key keeps working"],"lo":["LO4"],"day":3,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"d3-reconcile","type":"single","prompt":"A showback priced with the platform's price card is 10.9% above the provider's September invoice after a price cut. What makes the showback reconcile every month?","options":[{"key":"A","text":"Allocate each invoice line to the usage it covers"},{"key":"B","text":"Update the price card each quarter"},{"key":"C","text":"Add the difference to an 'other' line"},{"key":"D","text":"Ask the teams to tag every call"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Allocating the invoice reproduces what the Ministry pays, including credits and price changes.","misconceptions":["","Still drifts between updates and misses credits","Hides the gap instead of explaining it","Tags decide who pays, not how much"],"lo":["LO4"],"day":3,"session":4,"slide":null,"level":"evaluate","pool":"practice"},{"id":"d3-alloc-key","type":"single","prompt":"The data centre's fixed cost is shared by tokens and the contact team, whose speech model counts many tokens per call, gets 71% of it; by requests it would get 24%. What should the architect do?","options":[{"key":"A","text":"Use tokens, since it is the default"},{"key":"B","text":"Use whichever share the contact team accepts"},{"key":"C","text":"Split the difference at 47%"},{"key":"D","text":"Choose the key that best tracks server time, measure it, and record the choice"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The allocation key is a decision with consequences; it is measured and recorded, not defaulted.","misconceptions":["A default is not a reason","Negotiation is not measurement","Averages two keys without a reason for either",""],"lo":["LO4"],"day":3,"session":4,"slide":null,"level":"evaluate","pool":"practice"},{"id":"d4-golden-default","type":"single","prompt":"A platform's service template ships with its evaluation gate switched on. What does that default achieve that a recommendation in the template's README does not?","options":[{"key":"A","text":"Teams that take the easy way get the gate without deciding to"},{"key":"B","text":"It makes the gate impossible to switch off"},{"key":"C","text":"It removes the need for an evaluation set"},{"key":"D","text":"It moves the evaluation to the gateway"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Most teams keep defaults; a recommendation is what gets skipped under a deadline.","misconceptions":["","A good default can still be switched off, visibly, with a reason","The gate needs the team's evaluation set to run","The gateway cannot see a service's evaluation"],"lo":["LO5"],"day":4,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"d4-template-validator","type":"single","prompt":"A team generating a service from the platform's template answers Restricted for its data and an external model for its alias. What should the template do?","options":[{"key":"A","text":"Generate the service and leave the refusal to the gateway"},{"key":"B","text":"Refuse at generation, naming the placement rule the answer breaks"},{"key":"C","text":"Generate the service with the evaluation gate off"},{"key":"D","text":"Generate the service and email the platform team"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A validator refuses the disallowed placement before any code or data exists.","misconceptions":["Lets a non-conforming service be built and deployed first","","Switches off an unrelated gate","Notifies without preventing anything"],"lo":["LO5"],"day":4,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"d4-fallback","type":"single","prompt":"A design sends Restricted photos to a vision model hosted in the Kingdom, with an external model as its fallback. A placement check looks only at each flow's destination. What happens?","options":[{"key":"A","text":"The check fails the design, since the fallback is external"},{"key":"B","text":"The check fails every design that has a fallback"},{"key":"C","text":"The check passes the design, though Restricted photos reach an external model when the first one fails"},{"key":"D","text":"The check cannot run on a design with a fallback"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A fallback is a second destination for the same data; a check must follow it to see it.","misconceptions":["Credits the check with reading fallbacks it ignores","Over-reaches: fallbacks within the rule are fine","","The check runs; it just checks too little"],"lo":["LO5"],"day":4,"session":2,"slide":null,"level":"analyze","pool":"practice"},{"id":"d4-eval-order","type":"single","prompt":"A pipeline runs test, deploy, then a non-blocking evaluate stage with a 0.85 threshold on Arabic and English sets. Does it meet a standard that asks for an evaluation gate?","options":[{"key":"A","text":"Yes: it has an evaluate stage with a threshold"},{"key":"B","text":"Yes, if the threshold is raised to 0.90"},{"key":"C","text":"No: it needs a third language set"},{"key":"D","text":"No: an evaluation after deployment that blocks nothing gates nothing"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A gate must block, and before deployment; otherwise users already have the release it measures.","misconceptions":["Reads the stage's name, not its order or effect","The threshold is not the problem","Language coverage is not the problem here",""],"lo":["LO5"],"day":4,"session":2,"slide":null,"level":"evaluate","pool":"practice"},{"id":"d4-sensitivity","type":"single","prompt":"In a review, the board notes: 'The vision call takes 3,800 ms of the 5,000 ms latency budget.' How should it be tagged?","options":[{"key":"A","text":"A sensitivity point: the latency scenario depends on that one parameter"},{"key":"B","text":"Non-compliance: the budget is nearly spent"},{"key":"C","text":"A trade-off point: latency against quality"},{"key":"D","text":"A non-risk: the budget is met"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"One parameter decides whether a scenario is met; whether it becomes a risk depends on how much it moves.","misconceptions":["","No written standard is broken","Names no decision that moves two attributes in opposite directions","Misses how little room is left"],"lo":["LO6"],"day":4,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"d4-utility-tree","type":"single","prompt":"A review has an hour. Which scenario should it examine first?","options":[{"key":"A","text":"Oversight: important, easy to meet"},{"key":"B","text":"Arabic answer quality: important, hard to meet"},{"key":"C","text":"Latency: of medium importance, hard to meet"},{"key":"D","text":"Operability: of low importance, of medium difficulty"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A utility tree leads with scenarios high in both importance and difficulty.","misconceptions":["Important but easy: little for the review to find","","Hard, but less important than an important and hard scenario","Least important"],"lo":["LO6"],"day":4,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"d4-deviation","type":"single","prompt":"A deviation lets a team send photos the on-device detector passes as clean to an external model. Which record is complete?","options":[{"key":"A","text":"Approved; owner named; conditions listed"},{"key":"B","text":"Approved for as long as the team needs it, with conditions"},{"key":"C","text":"Approved with conditions that carry numbers, the residual risk and who accepts it, an expiry date and reopen triggers"},{"key":"D","text":"Refused, because any risk is too much"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A deviation is bounded: verifiable conditions, a stated residual, an owner of that risk and an end.","misconceptions":["Has no expiry or residual risk","Has no end: it becomes the standard","","Refusing has a cost too, and the record must state it"],"lo":["LO6"],"day":4,"session":4,"slide":null,"level":"evaluate","pool":"practice"}]}</script>
